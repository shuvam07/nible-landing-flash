<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#F5F5F5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Orange accent bar top -->
  <rect width="1200" height="6" fill="#F97316"/>
  
  <!-- Orange glow circle (decorative) -->
  <circle cx="900" cy="315" r="280" fill="#F97316" opacity="0.04"/>
  <circle cx="900" cy="315" r="180" fill="#F97316" opacity="0.04"/>
  
  <!-- Logo icon (rounded square with N) -->
  <rect x="80" y="200" width="80" height="80" rx="18" fill="#F97316"/>
  <text x="120" y="256" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">N</text>
  
  <!-- Brand name -->
  <text x="180" y="255" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#1A1A1A" text-anchor="start">Nible</text>
  
  <!-- Tagline -->
  <text x="80" y="340" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#1A1A1A" text-anchor="start">News that matters.</text>
  <text x="80" y="400" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#F97316" text-anchor="start">In 60 words.</text>
  
  <!-- Features -->
  <text x="80" y="475" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6B7280" text-anchor="start">Ad-free  •  No login  •  No tracking  •  Global &amp; local stories</text>
  
  <!-- URL -->
  <text x="80" y="550" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#F97316" font-weight="600" text-anchor="start">nible.news</text>
  
  <!-- Right side: phone mockup outline (decorative) -->
  <rect x="820" y="100" width="280" height="500" rx="30" fill="none" stroke="#E5E7EB" stroke-width="3"/>
  <rect x="835" y="120" width="250" height="460" rx="8" fill="#FAFAFA"/>
  
  <!-- Fake article cards in phone -->
  <rect x="855" y="145" width="210" height="16" rx="3" fill="#E5E7EB"/>
  
  <rect x="855" y="180" width="210" height="80" rx="8" fill="#F3F4F6"/>
  <rect x="865" y="190" width="140" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="865" y="208" width="180" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="222" width="160" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="236" width="60" height="8" rx="2" fill="#FDBA74"/>
  
  <rect x="855" y="275" width="210" height="80" rx="8" fill="#F3F4F6"/>
  <rect x="865" y="285" width="120" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="865" y="303" width="180" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="317" width="150" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="331" width="70" height="8" rx="2" fill="#FDBA74"/>
  
  <rect x="855" y="370" width="210" height="80" rx="8" fill="#F3F4F6"/>
  <rect x="865" y="380" width="150" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="865" y="398" width="170" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="412" width="190" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="426" width="55" height="8" rx="2" fill="#FDBA74"/>
  
  <rect x="855" y="465" width="210" height="80" rx="8" fill="#F3F4F6"/>
  <rect x="865" y="475" width="130" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="865" y="493" width="185" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="507" width="140" height="8" rx="2" fill="#E5E7EB"/>
  <rect x="865" y="521" width="65" height="8" rx="2" fill="#FDBA74"/>
  
  <!-- Notch -->
  <rect x="910" y="107" width="100" height="20" rx="10" fill="#E5E7EB"/>
  
  <!-- Bottom orange accent bar -->
  <rect y="624" width="1200" height="6" fill="#F97316"/>
</svg>
